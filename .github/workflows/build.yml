name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install python-tk@3.9

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # tkinter comes with Python on Windows, no additional setup needed

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed main.py

    - name: List build output (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        ls -la dist/
    - name: List build output (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Get-ChildItem dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ytdl-app-${{ matrix.name }}
        path: dist/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Display structure of downloaded files
      run: |
        ls -la artifacts/
        echo "Linux contents:"
        ls -la artifacts/ytdl-app-linux/
        echo "Windows contents:"
        ls -la artifacts/ytdl-app-windows/
        echo "macOS contents:"
        ls -la artifacts/ytdl-app-macos/

    - name: Rename executables for release
      run: |
        mv artifacts/ytdl-app-linux/main artifacts/ytdl-app-linux/ytdl-app-linux
        mv artifacts/ytdl-app-windows/main.exe artifacts/ytdl-app-windows/ytdl-app-windows.exe
        mv artifacts/ytdl-app-macos/main.app artifacts/ytdl-app-macos/ytdl-app-macos.app
        # Remove the standalone executable since we're using the .app bundle
        rm -f artifacts/ytdl-app-macos/main

    - name: Create instruction files
      run: |
        # Linux instructions
        cat > artifacts/ytdl-app-linux/README-LINUX.txt << 'EOF'
        YouTube Downloader for Linux
        ============================
        Made by Antonio Archer
        Website: antonioarcher.com
        Contact: adarcher.app
        Email: antonioarcher.dev@gmail.com
        
        Source Code (verify safety): https://github.com/AD-Archer/ytdl-app/blob/master/main.py
        
        How to run:
        
        Method 1 - Terminal (Recommended):
        1. Open Terminal in this folder
        2. Make the file executable: chmod +x ytdl-app-linux
        3. Run the app: ./ytdl-app-linux
        
        Method 2 - File Manager (GUI):
        1. Right-click on ytdl-app-linux
        2. Select "Properties" or "Permissions"
        3. Check "Allow executing file as program" or "Executable"
        4. Double-click the file to run
        
        If you get "Permission denied":
        - Run: chmod +x ytdl-app-linux
        - Then: ./ytdl-app-linux
        
        This app is safe - you can view the source code at the GitHub link above!
        Enjoy downloading YouTube videos!
        EOF
        
        # Windows instructions
        cat > artifacts/ytdl-app-windows/README-WINDOWS.txt << 'EOF'
        YouTube Downloader for Windows
        ==============================
        Made by Antonio Archer
        Website: antonioarcher.com
        Contact: adarcher.app
        Email: antonioarcher.dev@gmail.com
        
        Source Code (verify safety): https://github.com/AD-Archer/ytdl-app/blob/master/main.py
        
        How to run:
        1. Double-click ytdl-app-windows.exe
        
        If Windows shows "Windows protected your PC":
        - Click "More info"
        - Click "Run anyway"
        
        Alternative method:
        - Right-click the .exe file
        - Properties → Unblock → OK
        - Then double-click to run
        
        This app is safe - you can view the source code at the GitHub link above!
        Enjoy downloading YouTube videos!
        EOF
        
        # macOS instructions
        cat > artifacts/ytdl-app-macos/README-MACOS.txt << 'EOF'
        YouTube Downloader for macOS
        ============================
        Made by Antonio Archer
        Website: antonioarcher.com
        Contact: adarcher.app
        Email: antonioarcher.dev@gmail.com
        
        Source Code (verify safety): https://github.com/AD-Archer/ytdl-app/blob/master/main.py
        
        How to run:
        1. Double-click ytdl-app-macos.app to launch the application
        
        If macOS shows "cannot be opened because it is from an unidentified developer":
        - Right-click ytdl-app-macos.app and select "Open"
        - Click "Open" in the confirmation dialog
        
        Alternative: System Preferences method:
        - Go to System Preferences → Security & Privacy → General
        - Click "Open Anyway" next to the blocked app message
        
        This app is safe - you can view the source code at the GitHub link above!
        Enjoy downloading YouTube videos!
        EOF

    - name: Create ZIP files
      run: |
        cd artifacts
        zip -r linux.zip ytdl-app-linux/
        zip -r windows.zip ytdl-app-windows/
        zip -r mac.zip ytdl-app-macos/
        ls -la *.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/linux.zip
          artifacts/windows.zip
          artifacts/mac.zip
        generate_release_notes: true